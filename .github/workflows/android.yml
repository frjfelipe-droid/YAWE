name: App Android (APK)

on:
  push:
    paths:
      - "android/**"
      - ".github/workflows/android.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: Gerar APK
        working-directory: android
        run: gradle assembleRelease --no-daemon --stacktrace

      - name: Guardar APK
        run: cp android/app/build/outputs/apk/release/app-release.apk YAWE.apk

      - uses: actions/upload-artifact@v4
        with:
          name: YAWE-apk
          path: YAWE.apk

      - name: Publicar na página de Releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete app-android --yes --cleanup-tag || true
          gh release create app-android YAWE.apk \
            --target "${{ github.sha }}" \
            --title "YAWE para Android" \
            --notes "Baixe o arquivo YAWE.apk no celular e instale. Versão gerada automaticamente (execução ${{ github.run_number }})."
