<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>YAWE</title>
<style>
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 48px 24px 24px; box-sizing: border-box;
         font: 15px/1.5 system-ui, sans-serif; color: #f3f3f5; background: #0a0a0c; text-align: center; }
  .card { max-width: 340px; }
  .orb { width: 64px; height: 64px; border-radius: 50%; margin: 0 auto 18px; opacity: .55;
         background: conic-gradient(from 200deg, #ff2cdf, #0014ff, #00e1fd, #fc007a, #ff8c28, #ff2cdf); }
  h1 { font: 30px/1.1 Georgia, serif; margin: 0 0 10px; }
  p { color: #8e8e96; margin: 0 0 22px; }
  button { width: 100%; padding: 14px; border: 0; border-radius: 16px; font: inherit; font-weight: 600; margin-bottom: 10px; }
  .primary { color: #fff; background: linear-gradient(135deg, #a855f7, #5b3df5); }
  .ghost { background: #161619; color: #c9c9d1; border: 1px solid #26262c; }
</style>
</head>
<body>
  <div class="card">
    <div class="orb"></div>
    <h1>Sem conexão</h1>
    <p>Não consegui falar com o servidor. Confira sua internet. No plano grátis, o servidor dorme quando
       fica parado e pode levar até 1 minuto para acordar.</p>
    <button class="primary" onclick="window.YAWEAndroid.retry()">Tentar de novo</button>
    <button class="ghost" onclick="window.YAWEAndroid.changeServer()">Trocar endereço do servidor</button>
  </div>
</body>
</html>
