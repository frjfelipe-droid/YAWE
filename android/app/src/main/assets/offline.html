<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>YAWE</title>
<style>
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px; box-sizing: border-box;
         font: 15px/1.5 system-ui, sans-serif; color: #262035; background: #f5f2fb; text-align: center; }
  .card { max-width: 340px; }
  .orb { width: 64px; height: 64px; border-radius: 50%; margin: 0 auto 18px; opacity: .55;
         background: conic-gradient(from 200deg, #9fb4ff, #c79bff, #ffb6e1, #a5c8ff, #9fb4ff); }
  h1 { font: 30px/1.1 Georgia, serif; margin: 0 0 10px; }
  p { color: #5e5672; margin: 0 0 22px; }
  button { width: 100%; padding: 14px; border: 0; border-radius: 16px; font: inherit; font-weight: 600; margin-bottom: 10px; }
  .primary { color: #fff; background: linear-gradient(135deg, #8f84d6, #b18ae8); }
  .ghost { background: #fff; color: #5e5672; }
</style>
</head>
<body>
  <div class="card">
    <div class="orb"></div>
    <h1>Sem conexão</h1>
    <p>Não consegui falar com o servidor. Confira sua internet. No plano grátis, o servidor dorme quando
       fica parado e pode levar até 1 minuto para acordar.</p>
    <button class="primary" onclick="window.YAWEAndroid.retry()">Tentar de novo</button>
    <button class="ghost" onclick="window.YAWEAndroid.changeServer()">Trocar endereço do servidor</button>
  </div>
</body>
</html>
