<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
<meta name="theme-color" content="#05090f">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>YAWE</title>
<link rel="manifest" href="/manifest.json">
<link rel="icon" href="/static/icon-192.png">
<link rel="apple-touch-icon" href="/static/icon-192.png">
<style>
  :root {
    --bg: #05090f;
    --panel: #0b1420;
    --panel-2: #101c2b;
    --line: #1b2c40;
    --text: #e6f1ff;
    --muted: #7d93ad;
    --accent: #38d6ff;
    --accent-2: #0ea5d9;
    --danger: #ff6b6b;
    --user: #12324a;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { height: 100%; margin: 0; }
  body {
    background: radial-gradient(1200px 600px at 50% -200px, #0b2236 0%, var(--bg) 60%);
    background-color: var(--bg);
    color: var(--text);
    font: 16px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    display: flex; flex-direction: column;
    height: 100dvh;
  }
  button { font: inherit; color: inherit; cursor: pointer; }
  .hidden { display: none !important; }

  /* Cabeçalho */
  header {
    display: flex; align-items: center; gap: 12px;
    padding: calc(10px + env(safe-area-inset-top)) 16px 10px;
    border-bottom: 1px solid var(--line);
    background: rgba(5, 9, 15, .85); backdrop-filter: blur(10px);
  }
  .orb {
    width: 34px; height: 34px; border-radius: 50%; flex: none;
    background: radial-gradient(circle at 50% 50%, #bff3ff 0 12%, var(--accent) 13% 34%, transparent 35%),
                radial-gradient(circle, transparent 0 55%, var(--accent) 56% 62%, transparent 63%);
    box-shadow: 0 0 14px rgba(56, 214, 255, .55);
  }
  .orb.busy { animation: pulse 1.1s ease-in-out infinite; }
  @keyframes pulse { 50% { box-shadow: 0 0 26px rgba(56, 214, 255, .95); transform: scale(1.06); } }
  .title { flex: 1; min-width: 0; }
  .title h1 { margin: 0; font-size: 17px; letter-spacing: .08em; }
  .title small { color: var(--muted); font-size: 12px; display: block; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .icon-btn {
    width: 40px; height: 40px; border-radius: 12px; border: 1px solid var(--line);
    background: var(--panel); display: grid; place-items: center; flex: none;
  }
  .icon-btn svg { width: 20px; height: 20px; }
  .icon-btn.on { border-color: var(--accent); color: var(--accent); }

  /* Conversa */
  main { flex: 1; overflow-y: auto; padding: 16px; display: flex; flex-direction: column; gap: 12px; }
  .msg { max-width: 85%; padding: 10px 14px; border-radius: 16px; white-space: pre-wrap; overflow-wrap: anywhere; }
  .msg.user { align-self: flex-end; background: var(--user); border-bottom-right-radius: 4px; }
  .msg.ai { align-self: flex-start; background: var(--panel-2); border: 1px solid var(--line); border-bottom-left-radius: 4px; }
  .msg.ai.thinking { color: var(--muted); font-style: italic; }
  .msg.note { align-self: center; max-width: 95%; background: transparent; color: var(--muted); font-size: 13px; text-align: center; padding: 2px 8px; }
  .msg.error { align-self: center; max-width: 95%; color: var(--danger); font-size: 14px; text-align: center; background: rgba(255,107,107,.08); border: 1px solid rgba(255,107,107,.3); }
  .speak { display: block; margin-top: 6px; background: none; border: 0; color: var(--accent); font-size: 13px; padding: 0; }
  .empty { margin: auto; text-align: center; color: var(--muted); max-width: 320px; }
  .empty .orb { width: 72px; height: 72px; margin: 0 auto 16px; }

  /* Campo de mensagem */
  form.composer {
    display: flex; align-items: flex-end; gap: 8px;
    padding: 10px 12px calc(10px + env(safe-area-inset-bottom));
    border-top: 1px solid var(--line); background: rgba(5, 9, 15, .9);
  }
  textarea {
    flex: 1; resize: none; max-height: 140px; min-height: 44px;
    padding: 11px 14px; border-radius: 22px; border: 1px solid var(--line);
    background: var(--panel); color: var(--text); font: inherit; outline: none;
  }
  textarea:focus { border-color: var(--accent-2); }
  .round {
    width: 44px; height: 44px; border-radius: 50%; border: 0; flex: none;
    display: grid; place-items: center; background: var(--panel); border: 1px solid var(--line);
  }
  .round svg { width: 22px; height: 22px; }
  .round.send { background: var(--accent); color: #00202c; border: 0; }
  .round.send:disabled { opacity: .45; }
  .round.listening { background: var(--danger); color: #fff; border: 0; animation: pulse 1s infinite; }

  /* Login */
  .login { flex: 1; display: grid; place-items: center; padding: 24px; }
  .card { width: 100%; max-width: 340px; text-align: center; }
  .card .orb { width: 84px; height: 84px; margin: 0 auto 18px; }
  .card h1 { margin: 0 0 6px; letter-spacing: .1em; }
  .card p { color: var(--muted); margin: 0 0 20px; }
  .card input {
    width: 100%; padding: 13px 16px; border-radius: 14px; border: 1px solid var(--line);
    background: var(--panel); color: var(--text); font: inherit; outline: none; margin-bottom: 12px;
  }
  .card input:focus { border-color: var(--accent-2); }
  .card button {
    width: 100%; padding: 13px; border-radius: 14px; border: 0;
    background: var(--accent); color: #00202c; font-weight: 600;
  }
  .card .err { color: var(--danger); min-height: 24px; font-size: 14px; margin-top: 10px; }
</style>
</head>
<body>

<!-- Tela de login -->
<section id="login" class="login hidden">
  <form class="card" id="loginForm">
    <div class="orb"></div>
    <h1 class="app-name">YAWE</h1>
    <p>Digite a senha do app para continuar.</p>
    <input id="password" type="password" placeholder="Senha" autocomplete="current-password" required>
    <button type="submit">Entrar</button>
    <div class="err" id="loginErr"></div>
  </form>
</section>

<!-- Tela do chat -->
<header id="header" class="hidden">
  <div class="orb" id="orb"></div>
  <div class="title">
    <h1 class="app-name">YAWE</h1>
    <small id="subtitle">online</small>
  </div>
  <button class="icon-btn" id="voiceBtn" title="Ligar/desligar voz" aria-label="Ligar ou desligar voz">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M11 5 6 9H2v6h4l5 4V5z"/><path id="voiceWaves" d="M15.5 8.5a5 5 0 0 1 0 7M19 5a10 10 0 0 1 0 14"/></svg>
  </button>
  <button class="icon-btn" id="newBtn" title="Nova conversa" aria-label="Nova conversa">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>
  </button>
  <button class="icon-btn" id="logoutBtn" title="Sair" aria-label="Sair">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4M16 17l5-5-5-5M21 12H9"/></svg>
  </button>
</header>

<main id="messages" class="hidden">
  <div class="empty" id="empty">
    <div class="orb"></div>
    <div>Olá! Escreva uma mensagem ou toque no microfone para falar.</div>
  </div>
</main>

<form class="composer hidden" id="composer">
  <button type="button" class="round" id="micBtn" title="Falar" aria-label="Falar">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="2" width="6" height="12" rx="3"/><path d="M5 10a7 7 0 0 0 14 0M12 17v4M8 21h8"/></svg>
  </button>
  <textarea id="input" rows="1" placeholder="Mensagem" enterkeyhint="send"></textarea>
  <button type="submit" class="round send" id="sendBtn" aria-label="Enviar">
    <svg viewBox="0 0 24 24" fill="currentColor"><path d="M3.4 20.4 21 12 3.4 3.6 3.4 10l12.6 2-12.6 2z"/></svg>
  </button>
</form>

<script>
(() => {
  const $ = (id) => document.getElementById(id);
  const messages = $("messages"), input = $("input"), sendBtn = $("sendBtn");
  const orb = $("orb"), micBtn = $("micBtn"), voiceBtn = $("voiceBtn");

  let busy = false;
  let voiceAvailable = false;
  let voiceOn = true;
  try { voiceOn = localStorage.getItem("yawe-voice") !== "off"; } catch {}

  // Um único elemento de áudio, "destravado" no primeiro toque (exigência do iPhone/Android).
  const player = new Audio();
  player.setAttribute("playsinline", "");
  let audioUnlocked = false;
  // Áudio WAV silencioso gerado aqui mesmo, só para liberar o som no celular.
  const SILENT = (() => {
    const samples = 800, bytes = new Uint8Array(44 + samples * 2), v = new DataView(bytes.buffer);
    const w = (o, str) => [...str].forEach((c, k) => v.setUint8(o + k, c.charCodeAt(0)));
    w(0, "RIFF"); v.setUint32(4, 36 + samples * 2, true); w(8, "WAVEfmt ");
    v.setUint32(16, 16, true); v.setUint16(20, 1, true); v.setUint16(22, 1, true);
    v.setUint32(24, 8000, true); v.setUint32(28, 16000, true); v.setUint16(32, 2, true); v.setUint16(34, 16, true);
    w(36, "data"); v.setUint32(40, samples * 2, true);
    return "data:audio/wav;base64," + btoa(String.fromCharCode(...bytes));
  })();
  function unlockAudio() {
    if (audioUnlocked) return;
    audioUnlocked = true;
    player.src = SILENT;
    player.play().catch(() => {});
  }

  function show(screen) {
    $("login").classList.toggle("hidden", screen !== "login");
    for (const id of ["header", "messages", "composer"]) $(id).classList.toggle("hidden", screen !== "chat");
  }

  function setBusy(value) {
    busy = value;
    orb.classList.toggle("busy", value);
    sendBtn.disabled = value;
  }

  function addMessage(kind, text) {
    $("empty")?.remove();
    const el = document.createElement("div");
    el.className = "msg " + kind;
    el.textContent = text;
    messages.appendChild(el);
    messages.scrollTop = messages.scrollHeight;
    return el;
  }

  function renderVoiceBtn() {
    voiceBtn.classList.toggle("hidden", !voiceAvailable);
    voiceBtn.classList.toggle("on", voiceOn);
    $("voiceWaves").style.opacity = voiceOn ? 1 : 0.15;
  }

  async function speak(text) {
    if (!voiceAvailable || !text) return;
    try {
      const resp = await fetch("/api/tts", {
        method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ text }),
      });
      if (resp.status === 204) return;
      if (!resp.ok) {
        const data = await resp.json().catch(() => ({}));
        addMessage("note", "Voz: " + (data.error || "não foi possível gerar o áudio."));
        return;
      }
      const blob = await resp.blob();
      if (player.src.startsWith("blob:")) URL.revokeObjectURL(player.src);
      player.src = URL.createObjectURL(blob);
      await player.play();
    } catch {
      addMessage("note", "Toque em “ouvir” para escutar a resposta.");
    }
  }

  function addSpeakButton(bubble, text) {
    if (!voiceAvailable) return;
    const btn = document.createElement("button");
    btn.type = "button";
    btn.className = "speak";
    btn.textContent = "\u{1F50A} ouvir";
    btn.onclick = () => { unlockAudio(); speak(text); };
    bubble.appendChild(btn);
  }

  async function send(text) {
    text = text.trim();
    if (!text || busy) return;
    unlockAudio();
    player.pause();
    addMessage("user", text);
    input.value = "";
    autoGrow();
    setBusy(true);

    const bubble = addMessage("ai thinking", "pensando…");
    let full = "";
    let started = false;
    try {
      const resp = await fetch("/api/chat", {
        method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ message: text }),
      });
      if (resp.status === 401) { bubble.remove(); show("login"); return; }
      if (!resp.ok || !resp.body) {
        const data = await resp.json().catch(() => ({}));
        throw new Error(data.error || "Falha ao falar com o servidor.");
      }
      const reader = resp.body.getReader();
      const decoder = new TextDecoder();
      let buffer = "";
      for (;;) {
        const { value, done } = await reader.read();
        if (done) break;
        buffer += decoder.decode(value, { stream: true });
        let nl;
        while ((nl = buffer.indexOf("\n")) >= 0) {
          const line = buffer.slice(0, nl).trim();
          buffer = buffer.slice(nl + 1);
          if (!line) continue;
          const ev = JSON.parse(line);
          if (ev.t) {
            if (!started) { started = true; bubble.classList.remove("thinking"); bubble.textContent = ""; }
            full += ev.t;
            bubble.textContent = full;
            messages.scrollTop = messages.scrollHeight;
          } else if (ev.notice) {
            addMessage("note", ev.notice);
          } else if (ev.error) {
            bubble.remove();
            addMessage("error", ev.error);
          } else if (ev.done) {
            full = ev.text || full;
            bubble.textContent = full;
            if (ev.truncated) addMessage("note", "Resposta cortada por ser muito longa.");
            addSpeakButton(bubble, full);
            if (voiceOn) speak(full);
          }
        }
      }
    } catch (err) {
      bubble.remove();
      addMessage("error", err.message || "Sem conexão com o servidor. O PC está ligado e no mesmo Wi-Fi?");
    } finally {
      setBusy(false);
    }
  }

  // Campo de texto que cresce; Enter envia (Shift+Enter quebra linha)
  function autoGrow() { input.style.height = "auto"; input.style.height = Math.min(input.scrollHeight, 140) + "px"; }
  input.addEventListener("input", autoGrow);
  input.addEventListener("keydown", (e) => {
    if (e.key === "Enter" && !e.shiftKey && !e.isComposing) { e.preventDefault(); send(input.value); }
  });
  $("composer").addEventListener("submit", (e) => { e.preventDefault(); send(input.value); });

  // Microfone: reconhecimento de voz do próprio navegador (grátis)
  const Recognition = window.SpeechRecognition || window.webkitSpeechRecognition;
  let recognizer = null;
  // Navegadores só liberam o microfone em HTTPS (ou no próprio PC). Pelo Wi-Fi (http), use o microfone do teclado.
  if (!Recognition || !window.isSecureContext) {
    micBtn.classList.add("hidden");
  } else {
    micBtn.addEventListener("click", () => {
      unlockAudio();
      if (recognizer) { recognizer.stop(); return; }
      player.pause();
      recognizer = new Recognition();
      recognizer.lang = "pt-BR";
      recognizer.interimResults = true;
      let finalText = "";
      recognizer.onresult = (e) => {
        let interim = "";
        for (let i = e.resultIndex; i < e.results.length; i++) {
          const r = e.results[i];
          if (r.isFinal) finalText += r[0].transcript; else interim += r[0].transcript;
        }
        input.value = (finalText + interim).trim();
        autoGrow();
      };
      recognizer.onerror = (e) => {
        if (e.error === "not-allowed") addMessage("note", "Permita o uso do microfone para falar com o app.");
      };
      recognizer.onend = () => {
        micBtn.classList.remove("listening");
        recognizer = null;
        if (finalText.trim()) send(finalText);
      };
      micBtn.classList.add("listening");
      recognizer.start();
    });
  }

  voiceBtn.addEventListener("click", () => {
    unlockAudio();
    voiceOn = !voiceOn;
    if (!voiceOn) player.pause();
    try { localStorage.setItem("yawe-voice", voiceOn ? "on" : "off"); } catch {}
    renderVoiceBtn();
  });

  $("newBtn").addEventListener("click", async () => {
    if (busy) return;
    player.pause();
    await fetch("/api/reset", { method: "POST" });
    messages.innerHTML = "";
    addMessage("note", "Nova conversa iniciada.");
  });

  $("logoutBtn").addEventListener("click", async () => {
    player.pause();
    await fetch("/api/logout", { method: "POST" });
    location.reload();
  });

  $("loginForm").addEventListener("submit", async (e) => {
    e.preventDefault();
    unlockAudio();
    $("loginErr").textContent = "";
    const resp = await fetch("/api/login", {
      method: "POST", headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ password: $("password").value }),
    }).catch(() => null);
    if (resp && resp.ok) { $("password").value = ""; start(); }
    else $("loginErr").textContent = resp ? "Senha incorreta." : "Sem conexão com o servidor.";
  });

  async function start() {
    try {
      const st = await (await fetch("/api/status")).json();
      document.title = st.name;
      document.querySelectorAll(".app-name").forEach((el) => (el.textContent = st.name));
      if (!st.logged_in) { show("login"); $("password").focus(); return; }
      voiceAvailable = st.voice;
      $("subtitle").textContent = "online · " + st.model + (st.voice ? " · voz" : "");
      renderVoiceBtn();
      show("chat");
    } catch {
      document.body.innerHTML = '<p style="padding:24px">Não foi possível conectar ao servidor. Confira se o PC está ligado, com o app aberto, e no mesmo Wi-Fi.</p>';
    }
  }
  start();
})();
</script>
</body>
</html>
