<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
<meta name="theme-color" content="#f5f2fb">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<title>YAWE</title>
<link rel="manifest" href="/manifest.json">
<link rel="icon" href="/static/icon-192.png">
<link rel="apple-touch-icon" href="/static/icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    /* Menu (claro) */
    --bg: #f5f2fb;
    --bg-2: #efe9f9;
    --card: #ffffff;
    --ink: #262035;
    --ink-soft: #5e5672;
    --lilac: #8e83c9;
    --lilac-strong: #6f61b8;
    --line: #e6def4;
    --shadow: 0 10px 30px rgba(110, 90, 170, .12), 0 2px 6px rgba(110, 90, 170, .06);
    /* Tela do ser (escura) */
    --void: #07040d;
    --void-2: #160c2a;
    --glow: #b48cff;
    --caption: #efe7ff;
    --caption-soft: #a99cc9;
    --danger: #e0567a;
    --serif: "Instrument Serif", "Cormorant Garamond", Georgia, serif;
    --sans: Inter, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { height: 100%; margin: 0; }
  body {
    font: 15px/1.5 var(--sans); color: var(--ink);
    background: radial-gradient(900px 500px at 80% -10%, #ece4fb 0%, transparent 60%),
                radial-gradient(700px 500px at -10% 110%, #efe6fb 0%, transparent 55%), var(--bg);
    height: 100dvh; overflow: hidden;
  }
  button { font: inherit; color: inherit; cursor: pointer; border: 0; background: none; }
  .hidden { display: none !important; }
  .screen { position: fixed; inset: 0; display: flex; flex-direction: column; }

  /* ---------- Botões e pílulas ---------- */
  .pill {
    display: inline-flex; align-items: center; gap: 8px;
    padding: 8px 14px 8px 8px; border-radius: 999px;
    background: rgba(255,255,255,.8); box-shadow: var(--shadow); font-size: 13px; color: var(--ink-soft);
  }
  .dot-orb {
    width: 26px; height: 26px; border-radius: 50%; flex: none;
    background: radial-gradient(circle at 35% 30%, #fff 0 8%, transparent 30%),
                conic-gradient(from 200deg, #9fb4ff, #c79bff, #ffb6e1, #a5c8ff, #9fb4ff);
    filter: saturate(1.1); box-shadow: 0 0 12px rgba(170, 140, 255, .55);
  }
  .round {
    width: 40px; height: 40px; border-radius: 50%; display: grid; place-items: center;
    background: rgba(255,255,255,.85); box-shadow: var(--shadow); color: var(--ink-soft); flex: none;
  }
  .round svg { width: 18px; height: 18px; }
  .round.off { opacity: .45; }

  /* ---------- Login ---------- */
  #login { align-items: center; justify-content: center; padding: 24px; }
  .login-card { width: 100%; max-width: 340px; text-align: center; }
  .login-card .dot-orb { width: 74px; height: 74px; margin: 0 auto 22px; animation: breathe 4s ease-in-out infinite; }
  .login-card h1 { font: 44px/1 var(--serif); margin: 0 0 8px; color: var(--ink); }
  .login-card p { color: var(--ink-soft); margin: 0 0 22px; }
  .field {
    width: 100%; padding: 14px 18px; border-radius: 18px; border: 1px solid var(--line);
    background: var(--card); font: inherit; color: var(--ink); outline: none; box-shadow: var(--shadow); margin-bottom: 12px;
  }
  .field:focus { border-color: var(--lilac); }
  .primary {
    width: 100%; padding: 14px; border-radius: 18px; font-weight: 600; color: #fff;
    background: linear-gradient(135deg, #8f84d6, #b18ae8); box-shadow: 0 8px 22px rgba(140, 110, 220, .35);
  }
  .err { color: var(--danger); min-height: 22px; font-size: 14px; margin-top: 10px; }
  .link { margin-top: 18px; color: var(--lilac-strong); font-size: 14px; text-decoration: underline; }
  @keyframes breathe { 50% { transform: scale(1.06); box-shadow: 0 0 26px rgba(170,140,255,.75); } }

  /* ---------- Menu ---------- */
  #home { padding: calc(14px + env(safe-area-inset-top)) 20px calc(16px + env(safe-area-inset-bottom)); }
  .topbar { display: flex; align-items: center; gap: 10px; }
  .topbar .spacer { flex: 1; }
  .monogram { margin: 34px 0 18px; font: italic 40px/1 var(--serif); color: #b9afdc; letter-spacing: -.02em; }
  .hero { flex: 1; display: flex; flex-direction: column; min-height: 0; }
  .hero h2 { margin: 0; font: 46px/1.02 var(--serif); letter-spacing: -.01em; }
  .hero h2 .soft { color: var(--lilac); display: block; }
  .hero p { color: var(--ink-soft); margin: 16px 0 0; max-width: 300px; }
  .chips { display: flex; gap: 12px; overflow-x: auto; margin: auto -20px 18px; padding: 24px 20px 6px; scrollbar-width: none; }
  .chips::-webkit-scrollbar { display: none; }
  .chip {
    flex: none; display: flex; align-items: center; gap: 10px; padding: 12px 16px 12px 12px;
    border-radius: 18px; background: rgba(255,255,255,.75); box-shadow: var(--shadow);
    text-align: left; font-size: 13.5px; line-height: 1.25; color: var(--ink);
  }
  .chip i {
    width: 34px; height: 34px; border-radius: 12px; display: grid; place-items: center; font-style: normal;
    background: var(--bg-2); color: var(--lilac-strong);
  }
  .chip i svg { width: 18px; height: 18px; }

  /* Barra "toque para falar ou digite" */
  .composer {
    display: flex; align-items: center; gap: 10px; padding: 8px 8px 8px 8px;
    border-radius: 999px; background: rgba(255,255,255,.92); box-shadow: var(--shadow);
  }
  .composer textarea {
    flex: 1; border: 0; outline: none; resize: none; background: transparent; font: inherit; color: var(--ink);
    padding: 10px 4px; max-height: 110px; min-height: 24px; line-height: 1.4;
  }
  .composer textarea::placeholder { color: #9a92ad; }
  .mic {
    width: 46px; height: 46px; border-radius: 50%; flex: none; display: grid; place-items: center; color: #fff;
    background: radial-gradient(circle at 35% 30%, rgba(255,255,255,.9) 0 6%, transparent 32%),
                conic-gradient(from 200deg, #8fa6ff, #b98cff, #ff9fd4, #8fc0ff, #8fa6ff);
    box-shadow: 0 0 18px rgba(160, 130, 255, .55);
  }
  .mic svg { width: 20px; height: 20px; filter: drop-shadow(0 1px 2px rgba(60, 30, 120, .4)); }
  .mic.listening { animation: breathe 1s ease-in-out infinite; }
  .send { width: 42px; height: 42px; border-radius: 50%; display: grid; place-items: center; color: var(--lilac-strong); flex: none; }
  .send svg { width: 20px; height: 20px; }
  .send:disabled { opacity: .35; }

  /* ---------- Tela do ser (YAWE) ---------- */
  #being {
    background: radial-gradient(120% 70% at 50% 38%, var(--void-2) 0%, var(--void) 62%);
    color: var(--caption);
    padding: calc(14px + env(safe-area-inset-top)) 18px calc(16px + env(safe-area-inset-bottom));
  }
  #being .topbar .pill { background: rgba(255,255,255,.08); color: var(--caption-soft); box-shadow: none; padding: 9px 16px; }
  #being .topbar .pill svg { width: 14px; height: 14px; }
  #being .round { background: rgba(255,255,255,.08); color: var(--caption-soft); box-shadow: none; }
  .stage { position: relative; flex: 1; min-height: 0; display: flex; flex-direction: column; align-items: center; }
  #orbCanvas { width: 100%; flex: 1; min-height: 220px; display: block; }
  .state-label {
    font: italic 30px/1.1 var(--serif); color: #cdb8ff; text-align: center; margin: -6px 0 10px;
    text-shadow: 0 0 18px rgba(170, 120, 255, .45); min-height: 34px; transition: opacity .3s;
  }
  .captions {
    width: 100%; max-width: 560px; max-height: 32vh; overflow-y: auto; text-align: center;
    padding: 0 8px; margin-bottom: 14px; scrollbar-width: none;
  }
  .captions::-webkit-scrollbar { display: none; }
  .captions .you { color: var(--caption-soft); font-size: 13.5px; margin-bottom: 8px; }
  .captions .ai { font-size: 17px; line-height: 1.55; white-space: pre-wrap; overflow-wrap: anywhere; }
  .captions .note { color: var(--caption-soft); font-size: 13px; margin-top: 8px; }
  .captions .error { color: #ff8fb0; font-size: 14px; margin-top: 8px; }
  #being .composer { background: rgba(255,255,255,.08); box-shadow: none; border: 1px solid rgba(190, 160, 255, .18); }
  #being .composer textarea { color: var(--caption); }
  #being .composer textarea::placeholder { color: #8a7fa8; }
  #being .send { color: #cdb8ff; }

  /* ---------- Histórico ---------- */
  .sheet {
    position: fixed; inset: 0; z-index: 10; background: rgba(7, 4, 13, .55); display: flex; align-items: flex-end;
  }
  .sheet-body {
    width: 100%; max-height: 80dvh; overflow-y: auto; background: var(--bg); color: var(--ink);
    border-radius: 26px 26px 0 0; padding: 18px 18px calc(22px + env(safe-area-inset-bottom));
  }
  .sheet-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 12px; }
  .sheet-head h3 { margin: 0; font: 30px/1 var(--serif); }
  .hist { display: flex; flex-direction: column; gap: 10px; }
  .hist .m { max-width: 86%; padding: 10px 14px; border-radius: 18px; white-space: pre-wrap; overflow-wrap: anywhere; }
  .hist .m.user { align-self: flex-end; background: #e3dbf6; border-bottom-right-radius: 6px; }
  .hist .m.ai { align-self: flex-start; background: var(--card); box-shadow: var(--shadow); border-bottom-left-radius: 6px; }
  .hist .empty { color: var(--ink-soft); text-align: center; padding: 20px 0; }

  .toast {
    position: fixed; left: 50%; bottom: calc(96px + env(safe-area-inset-bottom)); transform: translateX(-50%);
    background: rgba(38, 32, 53, .92); color: #fff; padding: 10px 16px; border-radius: 14px; font-size: 13.5px;
    max-width: calc(100% - 40px); text-align: center; z-index: 20;
  }

  @media (min-width: 720px) {
    #home { max-width: 520px; margin: 0 auto; }
  }
  @media (prefers-reduced-motion: reduce) {
    .login-card .dot-orb, .mic.listening { animation: none; }
  }
</style>
</head>
<body>

<!-- ============ Login ============ -->
<section id="login" class="screen hidden">
  <form class="login-card" id="loginForm">
    <div class="dot-orb"></div>
    <h1 class="app-name">YAWE</h1>
    <p>Digite a senha para despertar o assistente.</p>
    <input class="field" id="password" type="password" placeholder="Senha" autocomplete="current-password" required>
    <button class="primary" type="submit">Entrar</button>
    <div class="err" id="loginErr"></div>
    <button type="button" class="link hidden" id="changeServer">Trocar endereço do servidor</button>
  </form>
</section>

<!-- ============ Menu ============ -->
<section id="home" class="screen hidden">
  <div class="topbar">
    <button class="pill" id="openBeing"><span class="dot-orb"></span><span><span class="app-name">YAWE</span> · <span id="statusText">online</span></span></button>
    <span class="spacer"></span>
    <button class="round" id="voiceBtn" title="Voz ligada/desligada" aria-label="Ligar ou desligar a voz">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M11 5 6 9H2v6h4l5 4V5z"/><path d="M15.5 8.5a5 5 0 0 1 0 7M19 5a10 10 0 0 1 0 14"/></svg>
    </button>
    <button class="round" id="logoutBtn" title="Sair" aria-label="Sair">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="4"/><path d="M4 21a8 8 0 0 1 16 0"/></svg>
    </button>
  </div>

  <div class="hero">
    <div class="monogram" id="monogram">Y</div>
    <h2><span class="soft" id="greeting">Olá, senhor</span>Como posso ajudar hoje?</h2>
    <p>Converse por voz ou por texto. Eu lembro do que falamos nesta conversa.</p>

    <div class="chips">
      <button class="chip" data-prompt="Me dê um resumo de ideias para organizar o meu dia.">
        <i><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 12h2M8 8v8M12 5v14M16 8v8M20 11v2"/></svg></i>Organizar<br>meu dia
      </button>
      <button class="chip" data-prompt="Me conte uma curiosidade interessante.">
        <i><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3l1.8 4.8L18.5 9l-4.7 1.2L12 15l-1.8-4.8L5.5 9l4.7-1.2z"/><path d="M19 15l.8 2.2L22 18l-2.2.8L19 21l-.8-2.2L16 18l2.2-.8z"/></svg></i>Uma<br>curiosidade
      </button>
      <button class="chip" data-prompt="Quero ter uma ideia nova. Me faça perguntas para me ajudar a pensar.">
        <i><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg></i>Pensar<br>junto
      </button>
      <button class="chip" id="historyChip">
        <i><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 1 0 3-6.7L3 8"/><path d="M3 3v5h5M12 7v5l3 2"/></svg></i>Ver<br>conversa
      </button>
      <button class="chip" id="newChip">
        <i><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg></i>Nova<br>conversa
      </button>
    </div>
  </div>

  <form class="composer" id="homeComposer">
    <button type="button" class="mic" data-mic aria-label="Falar">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="2" width="6" height="12" rx="3"/><path d="M5 10a7 7 0 0 0 14 0M12 17v4"/></svg>
    </button>
    <textarea rows="1" placeholder="Toque para falar ou digite…" enterkeyhint="send"></textarea>
    <button type="submit" class="send" aria-label="Enviar">
      <svg viewBox="0 0 24 24" fill="currentColor"><path d="M3.4 20.4 21 12 3.4 3.6 3.4 10l12.6 2-12.6 2z"/></svg>
    </button>
  </form>
</section>

<!-- ============ O ser (YAWE) ============ -->
<section id="being" class="screen hidden">
  <div class="topbar">
    <button class="pill" id="closeBeing">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M6 6l12 12M18 6 6 18"/></svg>
      Fechar
    </button>
    <span class="spacer"></span>
    <button class="round" id="historyBtn" title="Conversa" aria-label="Ver conversa">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>
    </button>
    <button class="round" id="voiceBtn2" title="Voz ligada/desligada" aria-label="Ligar ou desligar a voz">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M11 5 6 9H2v6h4l5 4V5z"/><path d="M15.5 8.5a5 5 0 0 1 0 7M19 5a10 10 0 0 1 0 14"/></svg>
    </button>
  </div>

  <div class="stage">
    <canvas id="orbCanvas" aria-label="YAWE"></canvas>
    <div class="state-label" id="stateLabel">Fale comigo</div>
    <div class="captions" id="captions"></div>
  </div>

  <form class="composer" id="beingComposer">
    <button type="button" class="mic" data-mic aria-label="Falar">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="2" width="6" height="12" rx="3"/><path d="M5 10a7 7 0 0 0 14 0M12 17v4"/></svg>
    </button>
    <textarea rows="1" placeholder="Escrever…" enterkeyhint="send"></textarea>
    <button type="submit" class="send" aria-label="Enviar">
      <svg viewBox="0 0 24 24" fill="currentColor"><path d="M3.4 20.4 21 12 3.4 3.6 3.4 10l12.6 2-12.6 2z"/></svg>
    </button>
  </form>
</section>

<!-- ============ Histórico ============ -->
<div class="sheet hidden" id="sheet">
  <div class="sheet-body">
    <div class="sheet-head">
      <h3>Conversa</h3>
      <button class="round" id="closeSheet" aria-label="Fechar"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M6 6l12 12M18 6 6 18"/></svg></button>
    </div>
    <div class="hist" id="hist"></div>
  </div>
</div>

<script>
(() => {
  const $ = (id) => document.getElementById(id);
  const screens = ["login", "home", "being"];
  const history = [];            // [{role, text}]
  let busy = false;
  let voiceAvailable = false;
  let voiceOn = true;
  try { voiceOn = localStorage.getItem("yawe-voice") !== "off"; } catch {}

  // ================= O SER: esfera de energia =================
  const canvas = $("orbCanvas");
  const ctx = canvas.getContext("2d");
  const orb = { state: "idle", level: 0, energy: 0.2, t: 0, running: false };
  const reduceMotion = matchMedia("(prefers-reduced-motion: reduce)").matches;
  const RINGS = 18;
  const ringSeeds = Array.from({ length: RINGS }, (_, i) => ({
    tiltX: Math.random() * Math.PI, tiltY: Math.random() * Math.PI * 2,
    speed: 0.25 + Math.random() * 0.5, phase: Math.random() * 10, hue: 258 + Math.random() * 40,
  }));

  function resizeCanvas() {
    const dpr = Math.min(window.devicePixelRatio || 1, 2);
    const r = canvas.getBoundingClientRect();
    canvas.width = Math.max(1, r.width * dpr);
    canvas.height = Math.max(1, r.height * dpr);
  }
  addEventListener("resize", resizeCanvas);

  // Nível do som: análise real do áudio da voz (Web Audio), com alternativa simulada.
  let audioCtx = null, analyser = null, freq = null;
  function audioLevel() {
    if (analyser && !player.paused) {
      analyser.getByteFrequencyData(freq);
      let sum = 0;
      const n = Math.min(64, freq.length);   // faixa da voz humana
      for (let i = 2; i < n; i++) sum += freq[i];
      return Math.min(1, (sum / (n - 2)) / 140);
    }
    if (!player.paused) return 0.35 + 0.35 * Math.abs(Math.sin(orb.t * 9) * Math.sin(orb.t * 3.7));
    return 0;
  }

  function drawOrb() {
    const w = canvas.width, h = canvas.height;
    const cx = w / 2, cy = h / 2;
    const R = Math.min(w, h) * 0.3;
    const target = { idle: 0.15, thinking: 0.45, listening: 0.6, speaking: 0.5 }[orb.state] ?? 0.15;
    orb.energy += (target - orb.energy) * 0.04;
    const lvl = orb.state === "speaking" ? audioLevel() : 0;
    orb.level += (lvl - orb.level) * (lvl > orb.level ? 0.5 : 0.12);
    const speed = { idle: 0.6, thinking: 2.2, listening: 1.4, speaking: 1.1 }[orb.state] ?? 0.6;
    orb.t += (reduceMotion ? 0.004 : 0.016) * speed;
    const t = orb.t, L = orb.level, E = orb.energy;

    ctx.globalCompositeOperation = "source-over";
    ctx.clearRect(0, 0, w, h);

    // Halo e "nebulosa" interna
    const breath = 1 + 0.03 * Math.sin(t * 1.3) + L * 0.12;
    let g = ctx.createRadialGradient(cx, cy, R * 0.2, cx, cy, R * 2.1 * breath);
    g.addColorStop(0, `rgba(150, 90, 255, ${0.22 + E * 0.15 + L * 0.3})`);
    g.addColorStop(0.45, `rgba(110, 60, 220, ${0.08 + L * 0.12})`);
    g.addColorStop(1, "rgba(20, 10, 40, 0)");
    ctx.fillStyle = g; ctx.fillRect(0, 0, w, h);

    ctx.globalCompositeOperation = "lighter";
    for (let k = 0; k < 3; k++) {
      const ox = Math.cos(t * 0.7 + k * 2.1) * R * 0.35, oy = Math.sin(t * 0.9 + k * 1.7) * R * 0.3;
      g = ctx.createRadialGradient(cx + ox, cy + oy, 0, cx + ox, cy + oy, R * 0.75);
      g.addColorStop(0, `hsla(${250 + k * 18}, 90%, 55%, ${0.12 + L * 0.18})`);
      g.addColorStop(1, "hsla(260, 90%, 40%, 0)");
      ctx.fillStyle = g; ctx.fillRect(0, 0, w, h);
    }

    // Linhas de luz: anéis 3D que giram e ondulam com a voz
    const STEPS = 96;
    for (let i = 0; i < RINGS; i++) {
      const s = ringSeeds[i];
      const ax = s.tiltX + Math.sin(t * 0.3 + s.phase) * 0.35 * s.speed;
      const ay = s.tiltY + t * (0.35 + s.speed * 0.25);
      const cxr = Math.cos(ax), sxr = Math.sin(ax), cyr = Math.cos(ay), syr = Math.sin(ay);
      ctx.beginPath();
      let depthSum = 0;
      for (let j = 0; j <= STEPS; j++) {
        const a = (j / STEPS) * Math.PI * 2;
        const wob = 1
          + 0.035 * Math.sin(3 * a + t * 1.7 + s.phase)
          + E * 0.04 * Math.sin(6 * a - t * 4 + i)
          + L * 0.2 * Math.sin(5 * a - t * 11 + s.phase)
          + L * 0.09 * Math.sin(11 * a + t * 17 + i * 1.3);
        let x = Math.cos(a) * wob, y = Math.sin(a) * wob, z = 0;
        // gira no eixo X e depois no Y
        let y2 = y * cxr - z * sxr, z2 = y * sxr + z * cxr;
        let x3 = x * cyr + z2 * syr, z3 = -x * syr + z2 * cyr;
        const px = cx + x3 * R * breath, py = cy + y2 * R * breath;
        depthSum += z3;
        j === 0 ? ctx.moveTo(px, py) : ctx.lineTo(px, py);
      }
      const front = 0.5 + 0.5 * Math.tanh(depthSum / STEPS * 3);
      const alpha = (0.1 + front * 0.35) * (0.75 + E * 0.5 + L * 0.8);
      const dpr = canvas.width / canvas.getBoundingClientRect().width || 1;
      ctx.strokeStyle = `hsla(${s.hue}, 95%, 72%, ${Math.min(0.9, alpha * 0.35)})`;
      ctx.lineWidth = (3.2 + L * 4) * dpr;
      ctx.stroke();
      ctx.strokeStyle = `hsla(${s.hue + 10}, 100%, 88%, ${Math.min(1, alpha)})`;
      ctx.lineWidth = (0.9 + L * 0.8) * dpr;
      ctx.stroke();
    }

    // Contorno da esfera
    for (let k = 0; k < 2; k++) {
      ctx.beginPath();
      for (let j = 0; j <= 120; j++) {
        const a = (j / 120) * Math.PI * 2;
        const rr = R * breath * (1.0 + 0.012 * Math.sin(4 * a + t * 2 + k)
          + L * 0.07 * Math.sin(7 * a - t * 13 + k * 2) + L * 0.04 * Math.sin(13 * a + t * 19));
        const px = cx + Math.cos(a) * rr, py = cy + Math.sin(a) * rr;
        j === 0 ? ctx.moveTo(px, py) : ctx.lineTo(px, py);
      }
      const dprr = canvas.width / canvas.getBoundingClientRect().width || 1;
      ctx.strokeStyle = k ? `rgba(240, 225, 255, ${0.35 + L * 0.5})` : `rgba(170, 110, 255, ${0.18 + L * 0.3})`;
      ctx.lineWidth = (k ? 1.1 + L : 6 + L * 8) * dprr;
      ctx.stroke();
    }

    // Núcleo brilhante
    g = ctx.createRadialGradient(cx, cy, 0, cx, cy, R * (0.55 + L * 0.25));
    g.addColorStop(0, `rgba(235, 220, 255, ${0.05 + L * 0.35})`);
    g.addColorStop(1, "rgba(160, 110, 255, 0)");
    ctx.fillStyle = g; ctx.fillRect(0, 0, w, h);
  }

  function loop() {
    if (!orb.running) return;
    // A área da esfera muda quando as legendas crescem: reajusta para não esticar o desenho.
    const r = canvas.getBoundingClientRect();
    const dpr = Math.min(window.devicePixelRatio || 1, 2);
    if (Math.abs(canvas.width - r.width * dpr) > 1 || Math.abs(canvas.height - r.height * dpr) > 1) resizeCanvas();
    drawOrb();
    requestAnimationFrame(loop);
  }
  function startOrb() {
    if (orb.running) return;
    orb.running = true;
    resizeCanvas();
    requestAnimationFrame(loop);
  }
  function stopOrb() { orb.running = false; }

  const LABELS = { idle: "Fale comigo", thinking: "Pensando…", listening: "Ouvindo…", speaking: "" };
  function setState(state) {
    orb.state = state;
    $("stateLabel").textContent = LABELS[state] ?? "";
  }

  // ================= Áudio =================
  const player = new Audio();
  player.setAttribute("playsinline", "");
  player.addEventListener("playing", () => { if (player.src.startsWith("blob:")) setState("speaking"); });
  player.addEventListener("ended", () => { if (orb.state === "speaking") setState("idle"); });
  player.addEventListener("pause", () => { if (orb.state === "speaking") setState("idle"); });

  // WAV silencioso gerado aqui, só para liberar o som no celular no primeiro toque.
  const SILENT = (() => {
    const samples = 800, bytes = new Uint8Array(44 + samples * 2), v = new DataView(bytes.buffer);
    const w = (o, str) => [...str].forEach((c, k) => v.setUint8(o + k, c.charCodeAt(0)));
    w(0, "RIFF"); v.setUint32(4, 36 + samples * 2, true); w(8, "WAVEfmt ");
    v.setUint32(16, 16, true); v.setUint16(20, 1, true); v.setUint16(22, 1, true);
    v.setUint32(24, 8000, true); v.setUint32(28, 16000, true); v.setUint16(32, 2, true); v.setUint16(34, 16, true);
    w(36, "data"); v.setUint32(40, samples * 2, true);
    return "data:audio/wav;base64," + btoa(String.fromCharCode(...bytes));
  })();
  let audioUnlocked = false;
  function unlockAudio() {
    if (!audioUnlocked) {
      audioUnlocked = true;
      player.src = SILENT;
      player.play().catch(() => {});
      try {
        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        const source = audioCtx.createMediaElementSource(player);
        analyser = audioCtx.createAnalyser();
        analyser.fftSize = 256;
        analyser.smoothingTimeConstant = 0.6;
        freq = new Uint8Array(analyser.frequencyBinCount);
        source.connect(analyser);
        analyser.connect(audioCtx.destination);
      } catch { analyser = null; }
    }
    if (audioCtx && audioCtx.state === "suspended") audioCtx.resume().catch(() => {});
  }

  async function speak(text) {
    if (!voiceAvailable || !voiceOn || !text) { setState("idle"); return; }
    try {
      const resp = await fetch("/api/tts", {
        method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ text }),
      });
      if (resp.status === 204) { setState("idle"); return; }
      if (!resp.ok) {
        const data = await resp.json().catch(() => ({}));
        caption("note", "Voz: " + (data.error || "não foi possível gerar o áudio."));
        setState("idle");
        return;
      }
      const blob = await resp.blob();
      if (player.src.startsWith("blob:")) URL.revokeObjectURL(player.src);
      player.src = URL.createObjectURL(blob);
      if (audioCtx && audioCtx.state === "suspended") await audioCtx.resume().catch(() => {});
      await player.play();
    } catch {
      setState("idle");
      toast("Toque na esfera para ouvir a resposta.");
    }
  }

  // ================= Navegação =================
  function show(name) {
    for (const s of screens) $(s).classList.toggle("hidden", s !== name);
    document.querySelector('meta[name="theme-color"]').content = name === "being" ? "#07040d" : "#f5f2fb";
    if (name === "being") startOrb(); else stopOrb();
  }

  function toast(text) {
    const el = document.createElement("div");
    el.className = "toast"; el.textContent = text;
    document.body.appendChild(el);
    setTimeout(() => el.remove(), 3200);
  }

  // ================= Legendas e histórico =================
  const captions = $("captions");
  function caption(kind, text) {
    const el = document.createElement("div");
    el.className = kind; el.textContent = text;
    captions.appendChild(el);
    captions.scrollTop = captions.scrollHeight;
    return el;
  }
  function renderHistory() {
    const box = $("hist");
    box.innerHTML = "";
    if (!history.length) { box.innerHTML = '<div class="empty">Nenhuma mensagem ainda.</div>'; return; }
    for (const m of history) {
      const el = document.createElement("div");
      el.className = "m " + m.role; el.textContent = m.text;
      box.appendChild(el);
    }
  }

  // ================= Conversa =================
  async function send(text) {
    text = (text || "").trim();
    if (!text || busy) return;
    unlockAudio();
    player.pause();
    document.querySelectorAll(".composer textarea").forEach((t) => { t.value = ""; grow(t); t.blur(); });
    show("being");
    busy = true;
    document.querySelectorAll(".send").forEach((b) => (b.disabled = true));
    setState("thinking");

    captions.innerHTML = "";
    caption("you", text);
    history.push({ role: "user", text });
    const aiEl = caption("ai", "");
    let full = "";
    let ok = false;
    try {
      const resp = await fetch("/api/chat", {
        method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ message: text }),
      });
      if (resp.status === 401) { history.pop(); show("login"); return; }
      if (!resp.ok || !resp.body) {
        const data = await resp.json().catch(() => ({}));
        throw new Error(data.error || "Falha ao falar com o servidor.");
      }
      const reader = resp.body.getReader();
      const decoder = new TextDecoder();
      let buffer = "";
      for (;;) {
        const { value, done } = await reader.read();
        if (done) break;
        buffer += decoder.decode(value, { stream: true });
        let nl;
        while ((nl = buffer.indexOf("\n")) >= 0) {
          const line = buffer.slice(0, nl).trim();
          buffer = buffer.slice(nl + 1);
          if (!line) continue;
          const ev = JSON.parse(line);
          if (ev.t) {
            full += ev.t;
            aiEl.textContent = full;
            captions.scrollTop = captions.scrollHeight;
          } else if (ev.notice) {
            caption("note", ev.notice);
          } else if (ev.error) {
            aiEl.remove();
            history.pop();
            caption("error", ev.error);
          } else if (ev.done) {
            full = ev.text || full;
            aiEl.textContent = full;
            history.push({ role: "ai", text: full });
            if (ev.truncated) caption("note", "Resposta cortada por ser muito longa.");
            ok = true;
          }
        }
      }
    } catch (err) {
      aiEl.remove();
      if (history.at(-1)?.role === "user") history.pop();
      caption("error", err.message || "Sem conexão com o servidor. O PC está ligado e no mesmo Wi-Fi?");
    } finally {
      busy = false;
      document.querySelectorAll(".send").forEach((b) => (b.disabled = false));
    }
    if (ok) speak(full); else setState("idle");
  }

  // Campos de texto
  function grow(t) {
    t.style.height = "auto";
    if (!t.value || !t.scrollHeight) return;          // vazio ou tela escondida: altura natural
    t.style.height = Math.min(t.scrollHeight, 110) + "px";
  }
  for (const form of [$("homeComposer"), $("beingComposer")]) {
    const ta = form.querySelector("textarea");
    ta.addEventListener("input", () => grow(ta));
    ta.addEventListener("keydown", (e) => {
      if (e.key === "Enter" && !e.shiftKey && !e.isComposing) { e.preventDefault(); send(ta.value); }
    });
    form.addEventListener("submit", (e) => { e.preventDefault(); send(ta.value); });
  }

  // Atalhos do menu
  document.querySelectorAll(".chip[data-prompt]").forEach((c) => c.addEventListener("click", () => send(c.dataset.prompt)));

  // ================= Microfone =================
  // O navegador só libera o microfone em HTTPS ou no próprio PC (localhost).
  const Recognition = window.SpeechRecognition || window.webkitSpeechRecognition;
  const androidApp = window.YAWEAndroid;          // existe só dentro do app Android
  const canListen = !!androidApp || (!!Recognition && window.isSecureContext);
  let recognizer = null;

  // App Android: usa o reconhecimento de voz nativo; o texto volta por aqui.
  window.yaweOnSpeech = (text) => {
    document.querySelectorAll("[data-mic]").forEach((b) => b.classList.remove("listening"));
    if (text && text.trim()) send(text); else setState("idle");
  };

  document.querySelectorAll("[data-mic]").forEach((btn) => btn.addEventListener("click", () => {
    unlockAudio();
    const ta = btn.closest("form").querySelector("textarea");
    if (androidApp) {
      player.pause();
      show("being");
      document.querySelectorAll("[data-mic]").forEach((b) => b.classList.add("listening"));
      setState("listening");
      androidApp.listen();
      return;
    }
    if (!canListen) {
      ta.focus();
      toast("Use o microfone do teclado do celular para ditar a mensagem.");
      return;
    }
    if (recognizer) { recognizer.stop(); return; }
    player.pause();
    show("being");
    const beingTa = $("beingComposer").querySelector("textarea");
    recognizer = new Recognition();
    recognizer.lang = "pt-BR";
    recognizer.interimResults = true;
    let finalText = "";
    recognizer.onresult = (e) => {
      let interim = "";
      for (let i = e.resultIndex; i < e.results.length; i++) {
        const r = e.results[i];
        if (r.isFinal) finalText += r[0].transcript; else interim += r[0].transcript;
      }
      beingTa.value = (finalText + interim).trim(); grow(beingTa);
    };
    recognizer.onerror = (e) => { if (e.error === "not-allowed") toast("Permita o uso do microfone."); };
    recognizer.onend = () => {
      document.querySelectorAll("[data-mic]").forEach((b) => b.classList.remove("listening"));
      recognizer = null;
      if (finalText.trim()) send(finalText); else setState("idle");
    };
    document.querySelectorAll("[data-mic]").forEach((b) => b.classList.add("listening"));
    setState("listening");
    recognizer.start();
  }));

  // ================= Botões =================
  function renderVoice() {
    for (const id of ["voiceBtn", "voiceBtn2"]) {
      $(id).classList.toggle("hidden", !voiceAvailable);
      $(id).classList.toggle("off", !voiceOn);
    }
  }
  for (const id of ["voiceBtn", "voiceBtn2"]) $(id).addEventListener("click", () => {
    unlockAudio();
    voiceOn = !voiceOn;
    if (!voiceOn) player.pause();
    try { localStorage.setItem("yawe-voice", voiceOn ? "on" : "off"); } catch {}
    renderVoice();
    toast(voiceOn ? "Voz ligada." : "Voz desligada.");
  });

  $("openBeing").addEventListener("click", () => { unlockAudio(); show("being"); });
  $("closeBeing").addEventListener("click", () => { player.pause(); show("home"); });
  canvas.addEventListener("click", () => {   // tocar na esfera repete a última resposta
    unlockAudio();
    const last = [...history].reverse().find((m) => m.role === "ai");
    if (last && player.paused && !busy) speak(last.text);
  });
  const openSheet = () => { renderHistory(); $("sheet").classList.remove("hidden"); };
  $("historyBtn").addEventListener("click", openSheet);
  $("historyChip").addEventListener("click", openSheet);
  $("closeSheet").addEventListener("click", () => $("sheet").classList.add("hidden"));
  $("sheet").addEventListener("click", (e) => { if (e.target.id === "sheet") $("sheet").classList.add("hidden"); });

  $("newChip").addEventListener("click", async () => {
    if (busy) return;
    player.pause();
    await fetch("/api/reset", { method: "POST" });
    history.length = 0;
    captions.innerHTML = "";
    toast("Nova conversa iniciada.");
  });

  $("logoutBtn").addEventListener("click", async () => {
    if (!confirm("Sair do app?")) return;
    player.pause();
    await fetch("/api/logout", { method: "POST" });
    location.reload();
  });

  $("loginForm").addEventListener("submit", async (e) => {
    e.preventDefault();
    unlockAudio();
    $("loginErr").textContent = "";
    const resp = await fetch("/api/login", {
      method: "POST", headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ password: $("password").value }),
    }).catch(() => null);
    if (resp && resp.ok) { $("password").value = ""; start(); }
    else {
      const data = resp ? await resp.json().catch(() => ({})) : {};
      $("loginErr").textContent = resp ? (data.error || "Senha incorreta.") : "Sem conexão com o servidor.";
    }
  });

  if (window.YAWEAndroid) {
    $("changeServer").classList.remove("hidden");
    $("changeServer").addEventListener("click", () => window.YAWEAndroid.changeServer());
  }

  function greeting() {
    const h = new Date().getHours();
    return h < 12 ? "Bom dia, senhor" : h < 18 ? "Boa tarde, senhor" : "Boa noite, senhor";
  }

  async function start() {
    try {
      const st = await (await fetch("/api/status")).json();
      document.title = st.name;
      document.querySelectorAll(".app-name").forEach((el) => (el.textContent = st.name));
      $("monogram").textContent = (st.name || "Y").slice(0, 1).toUpperCase();
      if (!st.logged_in) { show("login"); $("password").focus(); return; }
      voiceAvailable = st.voice;
      $("statusText").textContent = st.voice ? "online · voz" : "online";
      $("greeting").textContent = greeting();
      renderVoice();
      setState("idle");
      show("home");
    } catch {
      document.body.innerHTML = '<p style="padding:24px">Não foi possível conectar ao servidor. Confira se o PC está ligado, com o app aberto, e no mesmo Wi-Fi.</p>';
    }
  }
  start();
})();
</script>
</body>
</html>
